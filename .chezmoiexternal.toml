# =========================================================
# Things chezmoi downloads instead of storing in this repo
# chezmoi downloads each one on `chezmoi apply`, then again at
# most once every refreshPeriod. `chezmoi -R apply` forces a
# new download right away.
# =========================================================

# Oh My Zsh, loaded by ~/.config/zsh/omz.zsh
# exact = true: chezmoi removes anything in ~/.oh-my-zsh that
# isn't in the download, so omz.zsh keeps Oh My Zsh's cache in
# ~/.cache/oh-my-zsh instead.
[".oh-my-zsh"]
    type = "archive"
    url = "https://github.com/ohmyzsh/ohmyzsh/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"
