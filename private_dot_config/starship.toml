"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
scan_timeout = 100

format = "$directory$os$git_branch$git_status$nodejs$rust$golang$php$python$ruby$zig$line_break$character"

[os]
disabled = false
format = "[$symbol](#E95420) "

